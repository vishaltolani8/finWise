name: budget
description: A budget and financial tracking application designed for you

publish_to: "none"

version: 5.4.3+416

environment:
  sdk: ">= 3.3.0"

dependencies:
  flutter:
    sdk: flutter
  simple_animations: ^5.0.2
  sa3_liquid: ^1.0.1
  intl: ^0.20.2
  animations: ^2.0.11
  flutter_sticky_header: 0.8.0
  sticky_and_expandable_list: ^1.1.3
  fl_chart: ^0.68.0
  # database dependencies
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  math_expressions: ^2.6.0
  share_plus: ^10.1.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  universal_html: ^2.2.4
  flutter_charset_detector: ^5.0.0
  file_picker: ^8.1.7
  auto_size_text: ^3.0.0
  shared_preferences: ^2.3.2
  csv: ^6.0.0
  sliding_sheet:
    path: ./packages/sliding_sheet-0.5.2-modified/
  implicitly_animated_reorderable_list:
    path: ./packages/implicitly_animated_reorderable_list-0.4.2-modified/
  shimmer: ^3.0.0
  # carousel_slider v5 - upgraded, will fix CarouselController conflict with Flutter SDK
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.14.1
  package_info_plus: ^8.1.0
  transparent_image: ^2.0.0
  pausable_timer: ^3.1.0+3
  animated_fractionally_sized_box: ^2.0.1
  flutter_local_notifications: ^17.2.3
  system_theme: ^3.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_core_web: ^2.17.4
  firebase_auth_web: ^5.12.4
  recaptcha_enterprise_flutter: ^18.5.1
  sliver_tools: ^0.2.12
  reorderable_grid_view:
    git:
      url: https://github.com/jameskokoska/reorderable_grid_view
  local_auth: ^2.3.0
  timer_builder: ^2.0.0
  device_info_plus: ^10.1.2
  flutter_lazy_indexed_stack: ^0.0.6
  app_settings: ^5.1.1
  provider: ^6.1.2
  in_app_review: ^2.0.9
  # flutter_timezone v3 is a complete rewrite with different init - keeping v1
  flutter_timezone: ^3.0.0
  device_preview: ^1.2.0
  scrollable_positioned_list: ^0.3.8
  easy_localization: ^3.0.7
  quick_actions: ^1.0.7
  gradient_borders: ^1.0.1
  in_app_purchase: ^3.2.0
  visibility_detector: ^0.4.0+2
  confetti: ^0.7.0
  image_picker: ^1.1.2
  flutter_displaymode: ^0.6.0
  notification_listener_service: ^0.3.3
  # home_widget 0.7 - upgraded to fix ViewConfiguration 'size' parameter error
  home_widget: ^0.7.0
  material_symbols_icons: ^4.2795.0
  app_links: ^6.3.2
  expandable_page_view: ^1.0.17
  flutter_staggered_grid_view: ^0.7.0
  flutter_colorpicker: ^1.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_monochrome: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon-web.png"
    background_color: "#ffffff"
    theme_color: "#5f85c2"

dev_dependencies:
  drift_dev: ^2.18.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/categories/
    - assets/icon/
    - assets/landing/
    - assets/images/
    - assets/static/
    - assets/icons/fun/
    - assets/translations/generated/
    - assets/static/generated/
    - assets/static/generated/currencies.json
    - assets/static/language-names.json

  fonts:
    - family: Avenir
      fonts:
        - asset: assets/fonts/AvenirLTStd-Roman.otf
        - asset: assets/fonts/AvenirLTStd-Black.otf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
    - family: Inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata-Regular.ttf
        - asset: assets/fonts/Inconsolata-Bold.ttf
          weight: 700
    - family: Icons
      fonts:
        - asset: assets/icons/Icons.ttf
